<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#747b55">
  <meta name="description" content="2026年10月20日至26日「大阪，慢慢走」家族旅遊行程">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="大阪，慢慢走">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>大阪，慢慢走</title>
  <style>
    :root {
      --paper: #f8f3e9;
      --paper-deep: #eee6d7;
      --surface: #fffdf8;
      --ink: #393b32;
      --muted: #6d6c61;
      --sage: #747b55;
      --sage-deep: #545a3d;
      --sage-pale: #e1e2cc;
      --line: #dcd3c1;
      --peach: #f4e2d1;
      --warning: #ad7049;
      --warning-pale: #fff0df;
      --blue: #567985;
      --pink: #a96670;
      --gold: #9a7837;
      --shadow: 0 12px 32px rgba(77, 70, 56, .12);
      --radius: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(94, 86, 67, .025) 0 1px, transparent 1px 6px),
        var(--paper);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--sage-deep);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(86, 121, 133, .45);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 1000;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      transform: translateY(-150%);
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
    }

    .skip-link:focus {
      transform: none;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px 18px 26px;
      background:
        radial-gradient(circle at 85% 10%, rgba(255, 255, 255, .7), transparent 34%),
        linear-gradient(145deg, #e8e1d2, #f7efdf);
      border-bottom: 1px solid var(--line);
    }

    .hero::after {
      content: "大阪";
      position: absolute;
      right: 16px;
      bottom: 10px;
      color: rgba(116, 123, 85, .075);
      font-family: "Yu Mincho", "Noto Serif TC", serif;
      font-size: clamp(3rem, 11vw, 4.75rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .04em;
      white-space: nowrap;
      pointer-events: none;
    }

    .hero-inner,
    .page-shell {
      width: min(100%, 980px);
      margin-inline: auto;
    }

    .trip-kicker {
      margin: 0 0 6px;
      color: var(--sage-deep);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .14em;
    }

    h1,
    h2,
    h3 {
      font-family: "Yu Mincho", "Noto Serif TC", serif;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(2.15rem, 9vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1.2;
    }

    .date-range {
      position: relative;
      z-index: 1;
      margin: 8px 0 20px;
      color: var(--muted);
      font-weight: 700;
    }

    .lodging-overview {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 9px;
    }

    .lodging-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid rgba(116, 123, 85, .2);
      border-radius: 9px;
      background: rgba(255, 253, 248, .72);
    }

    .lodging-icon,
    .event-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      color: var(--sage-deep);
      background: var(--sage-pale);
    }

    .lodging-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
    }

    .lodging-icon svg,
    .event-icon svg,
    .button-icon svg {
      width: 22px;
      height: 22px;
    }

    .lodging-copy {
      min-width: 0;
    }

    .lodging-copy small,
    .lodging-copy strong {
      display: block;
    }

    .lodging-copy small {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }

    .lodging-copy strong {
      overflow-wrap: anywhere;
      font-size: .91rem;
      line-height: 1.35;
    }

    .map-link,
    .small-action {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 11px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--sage-deep);
      font-size: .78rem;
      font-weight: 900;
      line-height: 1.2;
      cursor: pointer;
    }

    .map-link:hover,
    .small-action:hover {
      border-color: var(--sage);
      background: #f4f4e8;
    }

    .page-shell {
      padding: 18px 14px 80px;
    }

    .reminders {
      margin-bottom: 17px;
      border: 1px solid #e4c5a7;
      border-radius: var(--radius);
      background: var(--warning-pale);
      box-shadow: 4px 4px 0 rgba(173, 112, 73, .09);
    }

    .reminders summary {
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      color: #76472f;
      list-style: none;
      cursor: pointer;
      font-weight: 900;
    }

    .reminders summary::-webkit-details-marker {
      display: none;
    }

    .alert-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: var(--warning);
      color: #fff;
      font-weight: 900;
    }

    .reminder-count {
      display: grid;
      width: 30px;
      height: 30px;
      margin-left: auto;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, .78);
      font-size: .8rem;
    }

    .reminders ol {
      margin: 0;
      padding: 0 22px 17px 48px;
      color: #614b3e;
      font-size: .9rem;
    }

    .reminders li + li {
      margin-top: 7px;
    }

    .date-nav-wrap {
      position: sticky;
      z-index: 20;
      top: 0;
      margin-inline: -14px;
      padding: 9px 14px;
      background: rgba(248, 243, 233, .94);
      border-block: 1px solid rgba(220, 211, 193, .75);
      backdrop-filter: blur(10px);
    }

    .date-nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      width: min(100%, 680px);
      margin-inline: auto;
    }

    .date-tab {
      min-width: 0;
      min-height: 62px;
      padding: 7px 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
    }

    .date-tab span,
    .date-tab strong {
      display: block;
    }

    .date-tab span {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
    }

    .date-tab strong {
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .date-tab[aria-selected="true"] {
      color: #fff;
      border-color: var(--sage);
      background: var(--sage);
      box-shadow: 4px 4px 0 rgba(84, 90, 61, .18);
    }

    .date-tab[aria-selected="true"] span {
      color: rgba(255, 255, 255, .82);
    }

    .day-panel {
      padding-top: 20px;
    }

    .day-panel.is-hidden {
      display: none;
    }

    .day-summary {
      padding: 17px 16px;
      border-left: 5px solid var(--sage);
      background: rgba(255, 253, 248, .62);
      box-shadow: 4px 4px 0 rgba(84, 90, 61, .08);
    }

    .day-number {
      margin: 0 0 3px;
      color: var(--sage-deep);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .1em;
    }

    .day-summary h2 {
      margin: 0;
      font-size: clamp(1.45rem, 6vw, 2.25rem);
      line-height: 1.35;
    }

    .day-facts {
      display: grid;
      gap: 7px;
      margin-top: 12px;
      color: var(--muted);
      font-size: .86rem;
    }

    .day-fact {
      display: grid;
      grid-template-columns: 4.7em minmax(0, 1fr);
      gap: 8px;
    }

    .day-fact strong {
      color: var(--ink);
    }

    .day-notice {
      margin: 13px 0 0;
      padding: 10px 12px;
      border-left: 4px solid var(--warning);
      background: var(--warning-pale);
      color: #694b39;
      font-size: .86rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
    }

    .toolbar-label {
      color: var(--sage-deep);
      font-weight: 900;
    }

    .toolbar-actions {
      display: flex;
      gap: 7px;
    }

    .timeline {
      display: grid;
      gap: 14px;
    }

    .event {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, .72);
      box-shadow: 4px 4px 0 rgba(84, 90, 61, .055);
    }

    .time-band {
      display: flex;
      min-height: 45px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 13px;
      color: #fff;
      background: var(--sage);
      font-size: .9rem;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .status {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff3dd;
      color: #85552f;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .status.official {
      background: #e7eef0;
      color: #3f6875;
    }

    .event-main {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 11px;
      padding: 15px 13px 14px;
    }

    .event-icon {
      width: 42px;
      height: 42px;
      border-radius: 9px;
    }

    .event[data-type="交通"] .event-icon {
      color: #476b76;
      background: #dce9ec;
    }

    .event[data-type="用餐"] .event-icon {
      color: #8c5a39;
      background: #f4e1cf;
    }

    .event[data-type="購物"] .event-icon {
      color: #8d5660;
      background: #f1dce0;
    }

    .event[data-type="景點"] .event-icon {
      color: #6b6841;
      background: #e8e4c6;
    }

    .event[data-type="飯店"] .event-icon {
      color: #655886;
      background: #e7e0ef;
    }

    .event-copy {
      min-width: 0;
    }

    .event-meta {
      margin: 0 0 3px;
      color: var(--sage-deep);
      font-size: .71rem;
      font-weight: 900;
      letter-spacing: .09em;
    }

    .event h3 {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: inherit;
      font-size: 1.08rem;
      line-height: 1.45;
    }

    .event-summary {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .event-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-toggle[aria-expanded="true"] .toggle-word::after {
      content: "收合";
    }

    .detail-toggle[aria-expanded="false"] .toggle-word::after {
      content: "詳細資訊";
    }

    .chevron {
      display: inline-block;
      transition: transform .2s ease;
    }

    .detail-toggle[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .event-details {
      grid-column: 1 / -1;
      margin-top: 1px;
      padding: 14px 13px 2px 55px;
      border-top: 1px dashed var(--line);
      background: rgba(238, 230, 215, .38);
    }

    .event-details[hidden] {
      display: none;
    }

    .detail-group {
      margin: 0 0 13px;
    }

    .detail-group dt {
      margin-bottom: 3px;
      color: var(--sage-deep);
      font-size: .77rem;
      font-weight: 900;
    }

    .detail-group dd {
      margin: 0;
      color: #55564e;
      font-size: .88rem;
    }

    .detail-group ul {
      margin: 4px 0 0;
      padding-left: 1.25em;
    }

    .detail-group li + li {
      margin-top: 4px;
    }

    .choices {
      display: grid;
      gap: 9px;
      margin-top: 11px;
    }

    .choice-button {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      width: 100%;
      min-height: 60px;
      padding: 11px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
    }

    .choice-letter {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 50%;
      background: var(--paper-deep);
      color: var(--sage-deep);
      font-weight: 900;
    }

    .choice-button[aria-pressed="true"] {
      border: 2px solid var(--sage);
      background: #f1f2e5;
    }

    .choice-button[aria-pressed="true"] .choice-letter {
      background: var(--sage);
      color: #fff;
    }

    .choice-note {
      margin: 8px 0 0;
      color: var(--warning);
      font-size: .77rem;
      font-weight: 900;
    }

    .day-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 21px;
    }

    .day-switcher button {
      min-height: 50px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--sage-deep);
      font-weight: 900;
      cursor: pointer;
    }

    .day-switcher button:disabled {
      opacity: .35;
      cursor: default;
    }

    .error-box {
      padding: 18px;
      border: 1px solid #d49b9b;
      border-radius: 10px;
      background: #fff0f0;
      color: #713f3f;
    }

    .top-button {
      position: fixed;
      z-index: 30;
      right: 15px;
      bottom: calc(15px + var(--safe-bottom));
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      transform: translateY(90px);
      border: 0;
      border-radius: 50%;
      background: var(--sage-deep);
      color: #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
    }

    .top-button.is-visible {
      transform: none;
      opacity: 1;
    }

    .top-button svg {
      width: 25px;
      height: 25px;
    }

    .footer-note {
      margin-top: 25px;
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
    }

    @media (min-width: 720px) {
      .hero {
        padding-block: 52px 42px;
      }

      .lodging-overview {
        grid-template-columns: 1fr 1fr;
      }

      .page-shell {
        padding: 25px 24px 90px;
      }

      .date-nav {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        width: min(100%, 900px);
      }

      .reminders ol {
        columns: 2;
        column-gap: 36px;
      }

      .reminders li {
        break-inside: avoid;
      }

      .day-facts {
        grid-template-columns: 1fr 1fr;
      }

      .timeline {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }

      .event-main {
        padding: 17px;
      }

      .event-details {
        padding-left: 70px;
      }

      .choices {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 420px) {
      body {
        font-size: 17px;
      }

      .hero {
        padding-inline: 14px;
      }

      .lodging-row {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .lodging-row .map-link {
        grid-column: 1 / -1;
        width: 100%;
      }

      .event-main {
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 9px;
        padding-inline: 11px;
      }

      .event-icon {
        width: 38px;
        height: 38px;
      }

      .event-details {
        padding-left: 12px;
      }

      .toolbar {
        align-items: flex-start;
      }

      .toolbar-label {
        width: 100%;
      }
    }

    @media print {
      :root {
        --paper: #fff;
        --surface: #fff;
      }

      body {
        font-size: 11pt;
        background: #fff;
      }

      .hero {
        padding: 16px 0;
        background: #fff;
      }

      .hero::after,
      .date-nav-wrap,
      .toolbar,
      .day-switcher,
      .top-button,
      .event-buttons,
      .choice-note,
      .skip-link {
        display: none !important;
      }

      .page-shell {
        width: 100%;
        padding: 0;
      }

      .reminders {
        box-shadow: none;
      }

      .reminders:not([open]) > *:not(summary) {
        display: block !important;
      }

      .day-panel,
      .day-panel.is-hidden {
        display: block !important;
        break-before: page;
      }

      .timeline {
        display: block;
      }

      .event {
        margin-bottom: 10px;
        break-inside: avoid;
        box-shadow: none;
      }

      .event-details,
      .event-details[hidden] {
        display: block !important;
      }

      .choices {
        grid-template-columns: 1fr 1fr;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至行程內容</a>

  <header class="hero" id="top">
    <div class="hero-inner">
      <h1>大阪，慢慢走</h1>
      <p class="date-range">2026年10月20日（週二）～10月26日（週一）</p>
    </div>
  </header>

  <main class="page-shell" id="main-content">
    <details class="reminders" open>
      <summary>
        <span class="alert-mark" aria-hidden="true">!</span>
        <span>待確認事項</span>
        <span class="reminder-count" id="reminder-count" aria-label="待確認事項數量">0</span>
      </summary>
      <ol id="reminder-list"></ol>
    </details>

    <div id="date-nav-anchor" aria-hidden="true"></div>
    <div class="date-nav-wrap">
      <nav class="date-nav" id="date-nav" role="tablist" aria-label="切換每日行程"></nav>
    </div>

    <div id="days-container"></div>
    <noscript>
      <div class="error-box">此行程頁需要啟用 JavaScript 才能切換日期與展開詳細資訊。</div>
    </noscript>
    <p class="footer-note">行程與營業資訊可能變動，出發前請再次確認官方公告。</p>
  </main>

  <button class="top-button" id="top-button" type="button" aria-label="回到頁面頂端" title="回到頁面頂端">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 14l6-6 6 6"></path>
    </svg>
  </button>

  <script>
    "use strict";

    const tripData = {
      reminders: [
        "10月21日晚餐要在心齋橋吃，或回MIMARU料理，尚未決定。",
        "10月22日計程車可能需要兩輛，或預約一輛大型計程車。",
        "和和鍋 道頓堀店10月22日午餐：最早可於9月24日預約。",
        "9月25日09:30預約AONIYOSHI觀光特急列車。"
      ],
      hotels: [
        {
          nights: "10月20日至21日",
          name: "MIMARU大阪 難波STATION ANNEX",
          note: "大阪府大阪市浪速區日本橋3-6-4",
          map: "MIMARU大阪 難波STATION ANNEX"
        },
        {
          nights: "10月22日",
          name: "環球影城港灣酒店",

    const iconPaths = {
      "飯店": '<path d="M4 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14M8 8h2m2 0h2m-6 4h2m2 0h2m-8 8v-4h8v4M2 20h20"/>',

      "購物": '<path d="M6 8h12l1 12H5L6 8zm3 0a3 3 0 0 1 6 0"/>',
      "用餐": '<path d="M7 3v8m-3-8v5a3 3 0 0 0 6 0V3M7 11v10m8-18v18m0-18c3 2 4 6 0 9"/>',
      "交通": '<path d="M6 17h12m-11 3h.01M17 20h.01M5 17V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10l-2 3M7 20l-2-3m1-6h12M8 7h8"/>'
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function iconSvg(type) {
      const path = iconPaths[type] || iconPaths["景點"];
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + "</svg>";
    }

    function mapUrl(query) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query || "大阪");
    }

    function mapLink(query, label, buttonLabel) {
      if (!query) return "";
      return '<a class="map-link" href="' + mapUrl(query) + '" target="_blank" rel="noopener noreferrer" aria-label="在新分頁開啟' +
        escapeHtml(label || query) + '的Google地圖">' + escapeHtml(buttonLabel || "開啟地圖") + ' <span aria-hidden="true">↗</span></a>';
    }

    function externalLink(url, label) {
      if (!url) return "";
      return '<a class="map-link" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(label || "開啟連結") + ' <span aria-hidden="true">↗</span></a>';
    }

    function renderReminders() {
      const list = document.getElementById("reminder-list");
      const count = document.getElementById("reminder-count");
      const reminders = Array.isArray(tripData.reminders) ? tripData.reminders : [];
      if (list) {
        list.innerHTML = reminders.length
          ? reminders.map((item) => "<li>" + escapeHtml(item) + "</li>").join("")
          : "<li>目前沒有待確認事項。</li>";
      }
      if (count) count.textContent = String(reminders.length);
    }

    function renderDetails(details) {
      const groups = Array.isArray(details) ? details : [];
      if (!groups.length) {
        return '<dl><div class="detail-group"><dt>詳細資訊</dt><dd>目前沒有其他補充內容。</dd></div></dl>';
      }
      return '<dl>' + groups.map((group) => {
        const values = Array.isArray(group.values) ? group.values : [];
        const content = values.length > 1
          ? "<ul>" + values.map((value) => "<li>" + escapeHtml(value) + "</li>").join("") + "</ul>"
          : escapeHtml(values[0] || "資料待補充");
        return '<div class="detail-group"><dt>' + escapeHtml(group.label || "補充資訊") + '</dt><dd>' + content + '</dd></div>';
      }).join("") + "</dl>";
    }

    function renderChoices(choices, eventId, choiceLabel, choiceNote) {
      if (!Array.isArray(choices) || !choices.length) return "";
      return '<div class="choices" role="group" aria-label="' + escapeHtml(choiceLabel || "行程選項") + '">' +
        choices.map((choice, index) => {
          const letter = String.fromCharCode(65 + index);
          return '<button class="choice-button" type="button" aria-pressed="false" data-choice-group="' + eventId + '">' +
            '<span class="choice-letter">' + letter + '</span><span>' + escapeHtml(choice) + '</span></button>';
        }).join("") +
        '</div><p class="choice-note">' + escapeHtml(choiceNote || "目前為「待決定」，點選僅供同行者比較，不代表已預訂。") + '</p>';
    }

    function renderEvent(item, dayIndex, itemIndex) {
      const safeItem = item && typeof item === "object" ? item : {};
      const eventId = "event-" + dayIndex + "-" + itemIndex;
      const type = safeItem.type || "景點";
      const status = safeItem.status
        ? '<span class="status ' + escapeHtml(safeItem.statusClass || "") + '">' + escapeHtml(safeItem.status) + '</span>'
        : "";
      const extraMaps = Array.isArray(safeItem.extraMaps)
        ? safeItem.extraMaps.map((entry) => mapLink(entry.query, entry.label, entry.buttonLabel)).join("")
        : "";
      const externalLinks = Array.isArray(safeItem.externalLinks)
        ? safeItem.externalLinks.map((entry) => externalLink(entry.url, entry.label)).join("")
        : "";

      return '<article class="event" data-type="' + escapeHtml(type) + '">' +
        '<div class="time-band"><span>' + escapeHtml(safeItem.time || "時間待補充") + '</span>' + status + '</div>' +
        '<div class="event-main">' +
          '<span class="event-icon">' + iconSvg(type) + '</span>' +
          '<div class="event-copy">' +
            '<p class="event-meta">' + escapeHtml(type) + '</p>' +
            '<h3>' + escapeHtml(safeItem.title || "行程內容待補充") + '</h3>' +
            (safeItem.summary ? '<p class="event-summary">' + escapeHtml(safeItem.summary) + '</p>' : "") +
            renderChoices(safeItem.choices, eventId, safeItem.choiceLabel, safeItem.choiceNote) +
            '<div class="event-buttons">' +
              mapLink(safeItem.map, safeItem.title) +
              extraMaps +
              externalLinks +
              '<button class="small-action detail-toggle" type="button" aria-expanded="false" aria-controls="' + eventId + '-details">' +
                '<span class="toggle-word"></span> <span class="chevron" aria-hidden="true">⌄</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="event-details" id="' + eventId + '-details" hidden>' + renderDetails(safeItem.details) + '</div>' +
        '</div>' +
      '</article>';
    }

    function renderDay(day, dayIndex) {
      const safeDay = day && typeof day === "object" ? day : {};
      const items = Array.isArray(safeDay.items) ? safeDay.items : [];
      return '<section class="day-panel' + (dayIndex === 0 ? "" : " is-hidden") + '" id="day-panel-' + dayIndex +
        '" role="tabpanel" aria-labelledby="day-tab-' + dayIndex + '">' +
        '<header class="day-summary">' +
          '<p class="day-number">' + escapeHtml(safeDay.dayNumber || ("第" + (dayIndex + 1) + "天")) + '・' +
            escapeHtml(safeDay.shortDate || "") + '・' + escapeHtml(safeDay.weekday || "") + '</p>' +
          '<h2>' + escapeHtml(safeDay.title || "當日行程待補充") + '</h2>' +
          '<div class="day-facts">' +
            '<div class="day-fact"><strong>當日住宿</strong><span>' + escapeHtml(safeDay.hotel || "待補充") + '</span></div>' +
            '<div class="day-fact"><strong>主要區域</strong><span>' + escapeHtml(safeDay.areas || "待補充") + '</span></div>' +
            '<div class="day-fact"><strong>行程重點</strong><span>' + escapeHtml(safeDay.highlight || "待補充") + '</span></div>' +
          '</div>' +
          (safeDay.notice ? '<p class="day-notice"><strong>行李提醒：</strong>' + escapeHtml(safeDay.notice) + '</p>' : "") +
        '</header>' +
        '<div class="toolbar">' +
          '<span class="toolbar-label">當日時間軸</span>' +
          '<div class="toolbar-actions">' +
            '<button class="small-action expand-all" type="button" data-day="' + dayIndex + '">展開全部</button>' +
            '<button class="small-action collapse-all" type="button" data-day="' + dayIndex + '">收合全部</button>' +
          '</div>' +
        '</div>' +
        '<div class="timeline">' +
          (items.length ? items.map((item, itemIndex) => renderEvent(item, dayIndex, itemIndex)).join("") :
            '<div class="error-box">這一天的行程資料目前無法顯示。</div>') +
        '</div>' +
        '<div class="day-switcher">' +
          '<button class="previous-day" type="button" data-target="' + (dayIndex - 1) + '"' + (dayIndex === 0 ? " disabled" : "") + '>← 前一天</button>' +
          '<button class="next-day" type="button" data-target="' + (dayIndex + 1) + '"' + (dayIndex === tripData.days.length - 1 ? " disabled" : "") + '>後一天 →</button>' +
        '</div>' +
      '</section>';
    }

    function renderDays() {
      const nav = document.getElementById("date-nav");
      const container = document.getElementById("days-container");
      const days = Array.isArray(tripData.days) ? tripData.days : [];
      if (!nav || !container) return;
      if (!days.length) {
        container.innerHTML = '<div class="error-box">行程資料目前無法顯示，請稍後再試。</div>';
        return;
      }

      nav.innerHTML = days.map((day, index) => {
        return '<button class="date-tab" id="day-tab-' + index + '" type="button" role="tab" aria-selected="' +
          (index === 0 ? "true" : "false") + '" aria-controls="day-panel-' + index + '" data-day="' + index + '">' +
          '<span>' + escapeHtml(day.weekday || "") + '</span><strong>' + escapeHtml(day.shortDate || ("第" + (index + 1) + "天")) + '</strong></button>';
      }).join("");

      container.innerHTML = days.map(renderDay).join("");
    }

    function selectDay(index, shouldScroll) {
      const days = Array.isArray(tripData.days) ? tripData.days : [];
      const nextIndex = Math.max(0, Math.min(Number(index), days.length - 1));
      document.querySelectorAll(".date-tab").forEach((tab, tabIndex) => {
        tab.setAttribute("aria-selected", String(tabIndex === nextIndex));
        tab.setAttribute("tabindex", tabIndex === nextIndex ? "0" : "-1");
      });
      document.querySelectorAll(".day-panel").forEach((panel, panelIndex) => {
        panel.classList.toggle("is-hidden", panelIndex !== nextIndex);
      });
      if (shouldScroll) {
        window.requestAnimationFrame(() => {
          const navAnchor = document.getElementById("date-nav-anchor");
          const top = navAnchor ? Math.max(0, navAnchor.offsetTop - 72) : 0;
          window.scrollTo({ top, behavior: "smooth" });
        });
      }
    }

    function setDetails(button, expanded) {
      const detailsId = button.getAttribute("aria-controls");
      const details = detailsId ? document.getElementById(detailsId) : null;
      if (!details) return;
      button.setAttribute("aria-expanded", String(expanded));
      details.hidden = !expanded;
    }

    function bindInteractions() {
      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target : null;
        if (!target) return;

      const tab = target.closest(".date-tab");
      if (tab) {
        if (tab instanceof HTMLElement) tab.blur();
        selectDay(Number(tab.getAttribute("data-day")), true);
        return;
      }

        const dayButton = target.closest(".previous-day, .next-day");
        if (dayButton && !dayButton.disabled) {
          if (dayButton instanceof HTMLElement) dayButton.blur();
          selectDay(Number(dayButton.getAttribute("data-target")), true);
          return;
        }

        const toggle = target.closest(".detail-toggle");
        if (toggle) {
          setDetails(toggle, toggle.getAttribute("aria-expanded") !== "true");
          return;
        }

        const expandButton = target.closest(".expand-all, .collapse-all");
        if (expandButton) {
          const dayIndex = expandButton.getAttribute("data-day");
          const panel = document.getElementById("day-panel-" + dayIndex);
          const shouldExpand = expandButton.classList.contains("expand-all");
          panel?.querySelectorAll(".detail-toggle").forEach((button) => setDetails(button, shouldExpand));
          return;
        }

        const choice = target.closest(".choice-button");
        if (choice) {
          const group = choice.getAttribute("data-choice-group");
          document.querySelectorAll('[data-choice-group="' + group + '"]').forEach((button) => {
            button.setAttribute("aria-pressed", String(button === choice));
          });
          return;
        }
      });

      document.getElementById("date-nav")?.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const active = document.activeElement;
        if (!(active instanceof HTMLElement) || !active.classList.contains("date-tab")) return;
        const current = Number(active.getAttribute("data-day"));
        const offset = event.key === "ArrowRight" ? 1 : -1;
        const next = Math.max(0, Math.min(current + offset, tripData.days.length - 1));
        event.preventDefault();
        selectDay(next, false);
        document.getElementById("day-tab-" + next)?.focus();
      });

      const topButton = document.getElementById("top-button");
      topButton?.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
      window.addEventListener("scroll", () => {
        topButton?.classList.toggle("is-visible", window.scrollY > 500);
      }, { passive: true });
    }

    function initialize() {
      try {
        renderReminders();
        renderDays();
        bindInteractions();
      } catch (error) {
        console.error("行程頁初始化失敗：", error);
        const container = document.getElementById("days-container");
        if (container) {
          container.innerHTML = '<div class="error-box"><strong>行程暫時無法完整顯示。</strong><br>請重新整理頁面；若問題持續，請檢查行程資料格式。</div>';
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  </script>
</body>
</html>
